
name: Windows Cloud PC - AnyDesk Melhorado

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando Sistema Reforçado
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PROCESSOR_COUNT: "8"
      OPENGL: "1"
      MEMORY_GB: "16"

    steps:
      - name: Baixar e Instalar Essenciais
        shell: pwsh
        run: |
          $url = "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1"

          Invoke-WebRequest -Uri $url -OutFile "Downloads.bat"

          if (Test-Path "Downloads.bat") {
              cmd.exe /c Downloads.bat
          } else {
              Write-Host "ERRO: Downloads.bat não encontrado."
              exit 1
          }

      - name: Iniciar AnyDesk
        shell: pwsh
        run: |
          if (Test-Path "start.bat") {
              Start-Process -FilePath "cmd.exe" -ArgumentList "/c start.bat" -Wait
          } else {
              Write-Host "ERRO: Arquivo start.bat não encontrado."
              exit 1
          }

      - name: Monitoramento do AnyDesk
        shell: pwsh
        run: |
          while ($true) {
              $anydesk = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

              if (-not $anydesk) {
                  Write-Host "AnyDesk não está ativo."
                  if (Test-Path "start.bat") {
                      Start-Process -FilePath "cmd.exe" -ArgumentList "/c start.bat"
                  }
              }

              Start-Sleep -Seconds 60
          }

      - name: Limpeza Segura
        if: always()
        shell: pwsh
        run: |
          Remove-Item "Downloads.bat" -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
          
